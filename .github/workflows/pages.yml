# Build the site and publish it, on every push to main.
#
# Writing an entry is adding a markdown file and pushing. There is no other
# publishing step, and nothing on my machine has to be working for it to go out.

name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read the repo, write a Pages deployment, and nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# If two pushes land close together the newer one wins, but a deploy already
# running is allowed to finish rather than being killed half way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` rather than `npm install`: it builds from the lockfile exactly,
      # so a build here can never quietly pick up a different version than the
      # one that worked locally.
      - run: npm ci

      - run: npm run lint

      - run: npm run build

      # A build that produced no entry page is a broken deploy that would look
      # fine, so check the thing actually got written before publishing it.
      - name: Check the build is not empty
        run: |
          test -f dist/index.html || { echo "no index.html"; exit 1; }
          test -f dist/404.html   || { echo "no 404.html, deep links would break"; exit 1; }
          grep -q "rise-mask" dist/assets/*.js || { echo "the site JS did not build"; exit 1; }

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
